services:
  app:

    build: .
    container_name: skautitvarozna
    
    restart: always
    
    env_file:
      - .env
    
    volumes:
      - ./credentials.json:/app/credentials.json:ro

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/healthy')<120 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s